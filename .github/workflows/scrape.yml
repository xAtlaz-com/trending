name: Scrape YouTube Trending

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-trending
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape all sources
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          COUNTRIES: ${{ vars.COUNTRIES || 'GB,US,JP,KR,IN,HK,TW' }}
          SOURCES: ${{ vars.SOURCES || 'youtube,twitter,reddit,instagram,github,weibo,zhihu,douyin,toutiao,bilibili,v2ex' }}
          ARCHIVE_HOURS: ${{ vars.ARCHIVE_HOURS || '0,12' }}
        run: python scraper/scrape_all.py

      - name: Generate latest.json + RSS
        env:
          COUNTRIES: ${{ vars.COUNTRIES || 'GB,US,JP,KR,IN,HK,TW' }}
          SOURCES: ${{ vars.SOURCES || 'youtube,twitter,reddit,instagram,github,weibo,zhihu,douyin,toutiao,bilibili,v2ex' }}
        run: python scraper/generate_outputs.py

      - name: Generate archive index pages
        run: python scraper/generate_archive_index.py

      - name: Generate sitemap.xml
        run: python scraper/generate_sitemap.py

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "trending-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
