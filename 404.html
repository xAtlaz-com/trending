<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Trending Pages</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>
.notfound { max-width: 560px; margin: 80px auto; padding: 0 20px; text-align: center; }
.notfound h1 { font-size: 72px; margin: 0; letter-spacing: -0.04em; color: var(--accent); }
.notfound h2 { font-size: 20px; margin: 8px 0 20px; font-weight: 500; }
.notfound a { color: var(--accent); text-decoration: none; }
.notfound a:hover { text-decoration: underline; }
.notfound ul { list-style: none; padding: 0; margin: 24px 0; color: var(--muted); font-size: 14px; }
.notfound ul li { margin: 6px 0; }
</style>
</head>
<body>
<div class="notfound">
  <img src="/assets/icon.png" alt="" width="64" height="64" />
  <h1>404</h1>
  <h2>Page not found</h2>
  <p><a href="/">← back to live trending</a></p>
  <ul>
    <li><a href="/data/latest.json">JSON API</a></li>
    <li><a href="/data/feed.xml">RSS feed</a></li>
    <li><a href="/data/archive/">Archive</a></li>
    <li><a href="https://github.com/xAtlaz-com/trending">Source on GitHub</a></li>
  </ul>
</div>
</body>
</html>
