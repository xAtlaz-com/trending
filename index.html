<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="title">Trending Pages</title>
<meta name="description" data-i18n-attr="content:description_meta" content="YouTube / GitHub / V2EX / 微博 / 知乎 / 抖音 / 头条 trending, refreshed every 30 minutes. RSS + JSON API included." />
<link rel="icon" type="image/png" href="./assets/icon.png" />
<link rel="apple-touch-icon" href="./assets/icon.png" />
<link rel="alternate" type="application/rss+xml" title="Trending (all)" href="./data/feed.xml" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<header>
  <div class="brand">
    <img src="./assets/icon.png" alt="" class="logo" />
    <h1 data-i18n="title">Trending Pages</h1>
    <select id="lang-select" class="lang-select" aria-label="Language"></select>
  </div>
  <p class="sub">
    <span data-i18n="subtitle">Refreshed every 30 min ·</span>
    <span id="updated" data-i18n="loading">loading…</span>
  </p>
  <nav class="links">
    <a href="./data/latest.json" data-i18n="nav_json">latest.json</a>
    <a href="./data/feed.xml" data-i18n="nav_rss">RSS</a>
    <a href="./data/archive/" data-i18n="nav_history">history</a>
    <a href="https://github.com/xAtlaz-com/trending" target="_blank" rel="noopener" data-i18n="nav_source">source</a>
  </nav>
</header>

<section class="sources" id="sources" role="tablist" aria-label="Source"></section>
<section class="tabs" id="tabs" role="tablist" aria-label="Sub"></section>

<main class="grid-wrap"><div id="grid" class="grid"></div></main>

<footer>
  <p><span data-i18n="footer_feeds">Per-source feeds:</span> <span id="per-source-feeds"></span></p>
</footer>

<script src="./assets/app.js"></script>
</body>
</html>
